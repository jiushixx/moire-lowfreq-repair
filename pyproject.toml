[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moire-lowfreq-repair"
version = "0.1.0"
description = "Course project: frozen ESDNet fusion and source-conditioned low-frequency correction"
requires-python = ">=3.10"
dependencies = ["torch", "numpy", "pandas", "Pillow", "PyYAML", "scikit-image", "matplotlib", "tqdm", "ipython", "gdown", "huggingface-hub"]

[tool.setuptools.packages.find]
where = ["src"]
